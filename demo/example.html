<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanvasVolumeTS Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        #myCanvas {
            border: 2px solid #333;
            background-color: #000;
            display: block;
            margin: 20px auto;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .info {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <h1>CanvasVolumeTS Example</h1>
        <div class="info">
            <p>This example demonstrates the CanvasVolumeTS library built with TypeScript and tsdown.</p>
            <p>The library is compiled to vanilla JavaScript for browser use.</p>
        </div>
        <canvas id="myCanvas" width="500" height="500"></canvas>
    </div>

    <!-- Using IIFE version for direct browser usage -->
    <script src="dist/index.iife.js"></script>
    <script>
        // Using the global CanvasVolumeTS object from the IIFE bundle
        //const { CanvasVolume } = CanvasVolumeTS;

        // load a sample volume.
        const url = "./example_data/labels.npy";
        CanvasVolumeTS.volume.loadNpyVolume(url).then(volume => {
            // display it on the canvas
            debugger;
            const canvas = document.getElementById("myCanvas");
            const display = new CanvasVolumeTS.display.CanvasVolume(canvas);
            display.setVolumeData(volume);
            display.draw();
            // add a slider after the canvas to control the slice
            const slider = document.createElement("input");
            slider.type = "range";
            slider.min = 0;
            slider.max = volume.depth - 1;
            slider.value = display.currentSlice;
            slider.style.width = "80%";
            slider.addEventListener("input", (event) => {
                display.sliceAt(parseInt(event.target.value));
                display.draw();
            });
            const container = document.getElementById("main-container");
            container.appendChild(slider);
        });

    </script>
</body>
</html>
