<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanvasVolumeTS Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        #myCanvas {
            border: 2px solid #333;
            background-color: #000;
            display: block;
            margin: 20px auto;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .info {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <h1>CanvasVolumeTS Example</h1>
        <div class="info">
            <p>This example demonstrates the CanvasVolumeTS library.</p>
            <p>Use the mouse wheel to zoom in and out, and click and drag to pan around the volume.</p>
        </div>
        <canvas id="myCanvas" width="500" height="500"></canvas>
    </div>

    <!-- Using IIFE version for direct browser usage -->
    <script src="../dist/index.iife.js"></script>
    <script>
        // Using the global CanvasVolumeTS object from the IIFE bundle
        //const { CanvasVolume } = CanvasVolumeTS;

        // load a sample volume.
        const url = "../example_data/labels.npy";
        //const url = "../example_data/chunk_37_40.npy";
        CanvasVolumeTS.volume.loadNpyVolume(url).then(volume => {
            // display it on the canvas
            //debugger;
            const canvas = document.getElementById("myCanvas");
            const display = new CanvasVolumeTS.display.CanvasVolume(canvas, "red");
            display.setVolumeData(volume);
            display.draw();
            // add a slider after the canvas to control the slice
            const slider = document.createElement("input");
            slider.type = "range";
            slider.min = 0;
            slider.max = volume.depth - 1;
            slider.value = display.currentSlice;
            slider.style.width = "80%";
            slider.addEventListener("input", (event) => {
                display.sliceAt(parseInt(event.target.value));
                display.draw();
            });
            const container = document.getElementById("main-container");
            container.insertAdjacentHTML('beforeend', '<br/><b>level</b>');
            container.appendChild(slider);
            // add a slider that adjusts the zoom from 1x to 5x
            container.insertAdjacentHTML('beforeend', '<br/><b>zoom</b>');
            const zoomSlider = document.createElement("input");
            zoomSlider.type = "range";
            zoomSlider.min = 0.02;
            zoomSlider.max = 5;
            zoomSlider.value = 1;
            zoomSlider.step = 0.02;
            zoomSlider.style.width = "80%";
            zoomSlider.addEventListener("input", (event) => {
                display.setZoom(parseFloat(event.target.value));
                display.draw();
            });
            container.appendChild(zoomSlider);
            function changeCenter(cx,cy) {
                display.center(cx,cy);
                display.draw();
            };
            // add sliders to change the center x and y
            const centerXSlider = document.createElement("input");
            centerXSlider.type = "range";
            centerXSlider.min = 0;
            centerXSlider.max = volume.width - 1;
            centerXSlider.value = Math.floor(volume.width / 2);
            centerXSlider.style.width = "80%";
            centerXSlider.addEventListener("input", (event) => {
                // get x and y from sliders
                const cx = parseInt(centerXSlider.value);
                const cy = parseInt(centerYSlider.value);
                changeCenter(cx, cy);
            });
            container.insertAdjacentHTML('beforeend', '<br/><b>center x</b>');
            container.appendChild(centerXSlider);
            const centerYSlider = document.createElement("input");
            centerYSlider.type = "range";
            centerYSlider.min = 0;
            centerYSlider.max = volume.height - 1;
            centerYSlider.value = Math.floor(volume.height / 2);
            centerYSlider.style.width = "80%";
            centerYSlider.addEventListener("input", (event) => {
                // get x and y from sliders
                const cx = parseInt(centerXSlider.value);
                const cy = parseInt(centerYSlider.value);
                changeCenter(cx, cy);
            });
            container.insertAdjacentHTML('beforeend', '<br/><b>center y</b>');
            container.appendChild(centerYSlider);
        });

    </script>
</body>
</html>
